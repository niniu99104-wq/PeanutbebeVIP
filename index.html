<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Peanut Bebe 出貨進度</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── tokens ── */
:root {
  --sage:        #6d9470;
  --sage-hover:  #5a7d5d;
  --sage-soft:   #edf3ee;
  --sage-mid:    #a8c5ab;
  --cream:       #f8f6f2;
  --paper:       #ffffff;
  --warm:        #f3efe8;
  --ink:         #28261f;
  --ink-mid:     #625f58;
  --ink-light:   #a09c94;
  --line:        #e8e3db;

  --r-card:  14px;
  --r-pill:  100px;
  --r-input: 8px;

  --s-wait-bg: #f0ece3; --s-wait-ink: #6e6050;
  --s-prep-bg: #e6eef9; --s-prep-ink: #2b5496;
  --s-pack-bg: #fdf0dd; --s-pack-ink: #845500;
  --s-done-bg: #e5f4e9; --s-done-ink: #1b6130;
}

/* ── reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 300;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── layout ── */
.wrap { max-width: 560px; margin: 0 auto; padding: 0 20px; }

/* ── header ── */
.site-header {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 50;
  padding: 0 20px;
}
.site-header-inner {
  max-width: 560px;
  margin: 0 auto;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo-mark {
  font-family: 'Noto Serif TC', serif;
  font-weight: 300;
  font-size: 15px;
  letter-spacing: .12em;
  color: var(--sage);
}
.logo-sub {
  font-size: 10px;
  letter-spacing: .16em;
  color: var(--ink-light);
  font-weight: 300;
  margin-top: 1px;
}
.admin-trigger {
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--ink-light);
  background: none;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  padding: 5px 14px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 300;
  transition: border-color .18s, color .18s;
}
.admin-trigger:hover { border-color: var(--sage-mid); color: var(--sage); }

/* ── page sections ── */
.page-top { padding: 32px 0 24px; }
.page-title {
  font-family: 'Noto Serif TC', serif;
  font-weight: 300;
  font-size: 22px;
  letter-spacing: .04em;
  color: var(--ink);
  margin-bottom: 6px;
}
.page-desc { font-size: 13px; color: var(--ink-light); letter-spacing: .02em; }

/* ── filter chips ── */
.filter-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.chip {
  font-size: 12px;
  font-family: inherit;
  font-weight: 300;
  letter-spacing: .04em;
  padding: 5px 14px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink-mid);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.chip:hover { border-color: var(--sage-mid); }
.chip.on { background: var(--sage); border-color: var(--sage); color: #fff; font-weight: 400; }

/* ── section label ── */
.sec-label {
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-light);
  font-weight: 400;
  margin-bottom: 12px;
}

/* ── group cards ── */
.group-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  margin-bottom: 10px;
  overflow: hidden;
  transition: box-shadow .18s;
}
.group-card:hover { box-shadow: 0 2px 20px rgba(0,0,0,.06); }

.group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 18px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.group-info { flex: 1; min-width: 0; }
.group-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.group-date {
  font-size: 11px;
  color: var(--ink-light);
  margin-top: 3px;
  letter-spacing: .02em;
}
.group-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.status-pill {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .04em;
  padding: 4px 12px;
  border-radius: var(--r-pill);
}
.s湊單中 { background: var(--s-wait-bg); color: var(--s-wait-ink); }
.s備貨中 { background: var(--s-prep-bg); color: var(--s-prep-ink); }
.s整理中 { background: var(--s-pack-bg); color: var(--s-pack-ink); }
.s已出貨 { background: var(--s-done-bg); color: var(--s-done-ink); }

.chevron {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-light);
  transition: transform .2s;
  flex-shrink: 0;
}
.chevron svg { display: block; }
.group-card.open .chevron { transform: rotate(180deg); }

.group-body {
  display: none;
  border-top: 1px solid var(--line);
  padding: 16px 18px 18px;
}
.group-card.open .group-body { display: block; }

/* progress bar */
.progress-track {
  display: flex;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--line);
  margin-bottom: 14px;
}
.progress-step {
  flex: 1;
  text-align: center;
  padding: 8px 4px;
  font-size: 11px;
  color: var(--ink-light);
  background: var(--cream);
  border-right: 1px solid var(--line);
  line-height: 1.3;
  letter-spacing: .02em;
}
.progress-step:last-child { border-right: none; }
.progress-step.done { background: var(--sage-soft); color: var(--sage); }
.progress-step.active { background: var(--sage); color: #fff; font-weight: 500; }

.group-eta {
  font-size: 12px;
  color: var(--ink-light);
  margin-bottom: 10px;
  letter-spacing: .02em;
}
.group-note {
  font-size: 13px;
  color: var(--ink-mid);
  background: var(--warm);
  border-radius: 8px;
  padding: 10px 13px;
  line-height: 1.75;
}

/* ── states ── */
.list-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--ink-light);
  font-size: 13px;
  line-height: 2;
}
.loading-dots {
  display: inline-flex;
  gap: 5px;
  margin-bottom: 12px;
}
.loading-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--sage-mid);
  animation: blink 1.2s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: .2s; }
.loading-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }

/* ── admin panel ── */
.admin-panel {
  display: none;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  margin-bottom: 28px;
  overflow: hidden;
}
.admin-panel.open { display: block; }

.admin-section {
  padding: 20px 20px 4px;
}
.admin-section + .admin-section {
  border-top: 1px solid var(--line);
  padding-top: 20px;
}

.admin-heading {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-light);
  margin-bottom: 16px;
}

/* login */
.login-row { display: flex; gap: 8px; margin-bottom: 16px; }
.login-row input {
  flex: 1;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-input);
  font-size: 14px;
  font-family: inherit;
  font-weight: 300;
  color: var(--ink);
  background: var(--cream);
  outline: none;
  transition: border-color .18s;
}
.login-row input:focus { border-color: var(--sage-mid); background: var(--paper); }
.btn-sage {
  padding: 10px 18px;
  background: var(--sage);
  color: #fff;
  border: none;
  border-radius: var(--r-input);
  font-size: 13px;
  font-family: inherit;
  font-weight: 400;
  cursor: pointer;
  letter-spacing: .04em;
  transition: background .18s;
  white-space: nowrap;
}
.btn-sage:hover { background: var(--sage-hover); }
.btn-sage:disabled { opacity: .5; cursor: not-allowed; }

/* form grid */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.form-grid.solo { grid-template-columns: 1fr; }
.fl { display: flex; flex-direction: column; gap: 4px; }
.fl label { font-size: 11px; color: var(--ink-light); letter-spacing: .06em; font-weight: 400; }
.fl input, .fl select, .fl textarea {
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: var(--r-input);
  font-size: 13px;
  font-family: inherit;
  font-weight: 300;
  color: var(--ink);
  background: var(--cream);
  outline: none;
  transition: border-color .18s;
}
.fl input:focus, .fl select:focus, .fl textarea:focus {
  border-color: var(--sage-mid);
  background: var(--paper);
}
.fl textarea { resize: vertical; min-height: 64px; line-height: 1.6; }
.btn-add {
  width: 100%;
  padding: 11px;
  background: var(--sage);
  color: #fff;
  border: none;
  border-radius: var(--r-input);
  font-size: 13px;
  font-family: inherit;
  font-weight: 400;
  letter-spacing: .06em;
  cursor: pointer;
  margin: 4px 0 20px;
  transition: background .18s;
}
.btn-add:hover { background: var(--sage-hover); }
.btn-add:disabled { opacity: .5; cursor: not-allowed; }

/* admin list */
.admin-list { }
.a-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.a-item:last-child { border-bottom: none; }
.a-item-info { flex: 1; min-width: 0; }
.a-item-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.a-item-date { font-size: 11px; color: var(--ink-light); margin-top: 1px; }
.a-status-select {
  font-size: 12px;
  font-family: inherit;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--cream);
  color: var(--ink);
  cursor: pointer;
  flex-shrink: 0;
}
.a-del {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  background: none;
  border: none;
  color: var(--ink-light);
  cursor: pointer;
  border-radius: 6px;
  font-size: 16px;
  flex-shrink: 0;
  transition: color .15s, background .15s;
}
.a-del:hover { color: #c0392b; background: #fef0ef; }

/* ── warning ── */
.gas-warning {
  background: #fffaeb;
  border: 1px solid #f0d58a;
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 12px;
  color: #7a5f00;
  line-height: 1.7;
  margin-bottom: 20px;
}
.gas-warning code { background: #f5e199; padding: 1px 5px; border-radius: 4px; font-size: 11px; }

/* ── toast ── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--ink);
  color: #fff;
  padding: 9px 20px;
  border-radius: var(--r-pill);
  font-size: 12px;
  letter-spacing: .04em;
  opacity: 0;
  pointer-events: none;
  z-index: 999;
  transition: opacity .2s, transform .2s;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── responsive ── */
@media (max-width: 480px) {
  .wrap { padding: 0 16px; }
  .site-header { padding: 0 16px; }
  .page-top { padding: 24px 0 20px; }
  .page-title { font-size: 19px; }
  .form-grid { grid-template-columns: 1fr; }
  .group-head { padding: 14px 15px; }
  .group-body { padding: 14px 15px 16px; }
  .admin-section { padding: 16px 15px 4px; }
  .progress-step { font-size: 10px; padding: 7px 2px; }
}
@media (min-width: 560px) {
  .site-header-inner, .wrap { max-width: 560px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <div>
      <div class="logo-mark">Peanut Bebe</div>
      <div class="logo-sub">出貨進度查詢</div>
    </div>
    <button class="admin-trigger" onclick="toggleAdmin()">管理員</button>
  </div>
</header>

<div class="wrap">

  <div class="page-top">
    <h1 class="page-title">出貨進度</h1>
    <p class="page-desc">選擇狀態篩選，或點開團名查看詳細進度</p>
  </div>

  <div class="gas-warning" id="gasWarning" style="display:none">
    ⚠️ 尚未連接資料來源。請在檔案中把 <code>GAS_URL</code> 換成你的 GAS 網址。
  </div>

  <!-- Admin -->
  <div class="admin-panel" id="ap">
    <!-- Login -->
    <div class="admin-section" id="authForm">
      <div class="admin-heading">管理員登入</div>
      <div class="login-row">
        <input type="password" id="pw" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')auth()">
        <button class="btn-sage" onclick="auth()">進入</button>
      </div>
    </div>
    <!-- Content -->
    <div id="adminContent" style="display:none">
      <div class="admin-section">
        <div class="admin-heading">新增團單</div>
        <div class="form-grid">
          <div class="fl"><label>團名稱</label><input id="fg" placeholder="例：夏季韓裝團"></div>
          <div class="fl"><label>結單日期</label><input type="date" id="fd"></div>
        </div>
        <div class="form-grid">
          <div class="fl"><label>目前狀態</label>
            <select id="fs">
              <option>湊單中</option><option>備貨中</option><option>整理中</option><option>已出貨</option>
            </select>
          </div>
          <div class="fl"><label>預計時間（選填）</label><input id="fe" placeholder="例：預計 7/15 出貨"></div>
        </div>
        <div class="form-grid">
          <div class="fl"><label>出貨日期（已出貨時填）</label><input type="date" id="fship"></div>
          <div class="fl"><label>　</label></div>
        </div>
        <div class="form-grid solo">
          <div class="fl"><label>備註（選填）</label><textarea id="fn" placeholder="例：韓國補貨中，感謝等待 🙏"></textarea></div>
        </div>
        <button class="btn-add" id="addBtn" onclick="addGroup()">新增團單</button>
      </div>
      <div class="admin-section" style="padding-bottom:20px">
        <div class="admin-heading">管理現有團單</div>
        <div class="admin-list" id="alist"></div>
      </div>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <button class="chip on" onclick="setFilter('all',this)">全部</button>
    <button class="chip" onclick="setFilter('湊單中',this)">湊單中</button>
    <button class="chip" onclick="setFilter('備貨中',this)">備貨中</button>
    <button class="chip" onclick="setFilter('整理中',this)">整理中</button>
    <button class="chip" onclick="setFilter('已出貨',this)">已出貨</button>
  </div>

  <div class="sec-label">所有團單</div>
  <div id="list"></div>

</div><!-- /wrap -->

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
//  ★ GAS 網址
// ═══════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzCrtvdn4LNvRL5Y_FdfN6C6HVQXV5SeLcvpV5LA7hieTeGNf9UOo-nUW3ZLbfxaCbl4w/exec';
// ═══════════════════════════════════════════════

const STEPS = ['湊單中','備貨中','整理中','已出貨'];
const SORDER = {'湊單中':0,'備貨中':1,'整理中':2,'已出貨':3};
let curFilter = 'all', authed = false, cachedGroups = [];

window.addEventListener('DOMContentLoaded', () => {
  if (!GAS_URL) { document.getElementById('gasWarning').style.display='block'; showDemo(); return; }
  loadGroups();
});

/* ── JSONP helpers ── */
function gasGet(action) {
  return new Promise((res, rej) => {
    const cb = '_cb' + Date.now();
    const s = document.createElement('script');
    s.src = `${GAS_URL}?action=${action}&callback=${cb}`;
    window[cb] = d => { delete window[cb]; s.remove(); res(d); };
    s.onerror = () => { delete window[cb]; s.remove(); rej(); };
    document.body.appendChild(s);
  });
}
function gasPost(p) {
  return new Promise((res, rej) => {
    const cb = '_cb' + Date.now();
    const s = document.createElement('script');
    s.src = GAS_URL + '?' + Object.entries({...p, callback:cb}).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    window[cb] = d => { delete window[cb]; s.remove(); res(d); };
    s.onerror = () => { delete window[cb]; s.remove(); rej(); };
    document.body.appendChild(s);
  });
}

/* ── data ── */
function showDemo() {
  cachedGroups = [
    {id:'1',group:'夏季韓裝團',date:'2025-06-01',status:'整理中',eta:'預計本週出貨',note:'到貨了！正在裝袋中 🌿'},
    {id:'2',group:'6月選品團',date:'2025-06-10',status:'備貨中',eta:'預計 6/25 出貨',note:'韓國備貨中，稍等 🙏'},
    {id:'3',group:'草編涼鞋湊單',date:'2025-06-15',status:'湊單中',eta:'額滿即出',note:'快額滿了！'},
    {id:'4',group:'5月韓裝團',date:'2025-05-10',status:'已出貨',eta:'5/28 已寄出',note:''},
  ];
  render();
}

async function loadGroups(silent=false) {
  if (!silent) showLoading();
  try {
    const d = await gasGet('getGroups');
    cachedGroups = Array.isArray(d) ? d : [];
    render();
  } catch { document.getElementById('list').innerHTML = '<div class="list-state">無法載入資料，請稍後再試</div>'; }
}

/* ── render ── */
function showLoading() {
  document.getElementById('list').innerHTML = `
    <div class="list-state">
      <div class="loading-dots"><span></span><span></span><span></span></div><br>載入中
    </div>`;
}

function stepCls(status, step) {
  const si = STEPS.indexOf(status), pi = STEPS.indexOf(step);
  return pi < si ? 'done' : pi === si ? 'active' : '';
}

function render() {
  const f = curFilter === 'all' ? cachedGroups : cachedGroups.filter(g => g.status === curFilter);
  const list = document.getElementById('list');
  if (!f.length) {
    list.innerHTML = '<div class="list-state">目前沒有這個狀態的團單 🌿</div>'; return;
  }
  const sorted = [...f].sort((a,b) => SORDER[a.status] - SORDER[b.status]);
  list.innerHTML = sorted.map(g => `
    <div class="group-card" id="card-${g.id}">
      <div class="group-head" onclick="toggle('${g.id}')">
        <div class="group-info">
          <div class="group-name">${esc(g.group)}</div>
          <div class="group-date">結單 ${fmtDate(g.date)}</div>
        </div>
        <div class="group-right">
          <span class="status-pill s${g.status}">${g.status}</span>
          <span class="chevron">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
      </div>
      <div class="group-body">
        <div class="progress-track">
          ${STEPS.map(s=>`<div class="progress-step ${stepCls(g.status,s)}">${s}</div>`).join('')}
        </div>
        ${g.eta ? `<div class="group-eta">${esc(g.eta)}</div>` : ''}
        ${g.shipped_at ? `<div class="group-eta" style="color:var(--s-done-ink);font-weight:500">📦 出貨日期：${fmtDate(g.shipped_at)}</div>` : ''}
        ${g.note ? `<div class="group-note">${esc(g.note)}</div>` : ''}
      </div>
    </div>`).join('');
}

function toggle(id) { document.getElementById('card-'+id)?.classList.toggle('open'); }

function setFilter(f, el) {
  curFilter = f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  render();
}

/* ── admin ── */
function toggleAdmin() {
  const p = document.getElementById('ap');
  p.classList.toggle('open');
  if (p.classList.contains('open') && authed) renderAdminList();
}

async function auth() {
  const input = document.getElementById('pw').value;
  if (!GAS_URL) { if (input) openAdmin(); else toast('請輸入密碼'); return; }
  try {
    const d = await gasGet('getPassword');
    input === String(d.password) ? openAdmin() : toast('密碼不對，請再試');
  } catch { toast('連線失敗，請稍後再試'); }
}

function openAdmin() {
  authed = true;
  document.getElementById('authForm').style.display = 'none';
  document.getElementById('adminContent').style.display = 'block';
  renderAdminList();
}

function renderAdminList() {
  const el = document.getElementById('alist');
  if (!cachedGroups.length) { el.innerHTML = '<div style="font-size:12px;color:var(--ink-light);padding:8px 0">尚無團單</div>'; return; }
  el.innerHTML = cachedGroups.map(g => `
    <div class="a-item">
      <div class="a-item-info">
        <div class="a-item-name">${esc(g.group)}</div>
        <div class="a-item-date">結單 ${fmtDate(g.date)}</div>
      </div>
      <select class="a-status-select" onchange="updateStatus('${g.id}',this.value)">
        ${STEPS.map(s=>`<option${s===g.status?' selected':''}>${s}</option>`).join('')}
      </select>
      <button class="a-del" onclick="del('${g.id}')" title="刪除">×</button>
    </div>`).join('');
}

async function addGroup() {
  const group = document.getElementById('fg').value.trim();
  const date  = document.getElementById('fd').value;
  const status= document.getElementById('fs').value;
  const eta   = document.getElementById('fe').value.trim();
  const note  = document.getElementById('fn').value.trim();
  if (!group) { toast('請填寫團名稱'); return; }
  const btn = document.getElementById('addBtn');
  btn.disabled = true; btn.textContent = '新增中…';
  const shipped_at = document.getElementById('fship').value;
  const payload = {action:'addGroup', group, date: date||today(), status, eta, note, shipped_at};
  if (!GAS_URL) { cachedGroups.unshift({id:Date.now()+'',group,date:date||today(),status,eta,note,shipped_at}); done(); return; }
  try { await gasPost(payload); await loadGroups(true); done(); }
  catch { toast('新增失敗，請稍後再試'); btn.disabled=false; btn.textContent='新增團單'; }
  function done() {
    ['fg','fd','fe','fn','fship'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('fs').value='湊單中';
    btn.disabled=false; btn.textContent='新增團單';
    renderAdminList(); toast('已新增「'+group+'」');
  }
}

async function updateStatus(id, status) {
  const g = cachedGroups.find(x=>String(x.id)===String(id));
  if (g) g.status = status;
  render();
  if (!GAS_URL) { toast('狀態已更新'); return; }
  try { await gasPost({action:'updateStatus',id,status}); toast('狀態已更新'); }
  catch { toast('更新失敗，請重試'); }
}

async function del(id) {
  if (!confirm('確定刪除這個團單？')) return;
  cachedGroups = cachedGroups.filter(x=>String(x.id)!==String(id));
  render(); renderAdminList();
  if (!GAS_URL) { toast('已刪除'); return; }
  try { await gasPost({action:'deleteGroup',id}); toast('已刪除'); }
  catch { toast('刪除失敗，請重試'); }
}

/* ── utils ── */
function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
</script>
